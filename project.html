<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة المشروع</title><link rel="stylesheet" href="styles.css"></head><body data-page="projects"><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">م</div><div><b>منصة متابعة المشاريع</b><small>المحتوى المحلي والمناقصات</small></div></div><nav class="nav"><a href="index.html" data-page="dashboard">⌂ <span>الرئيسية</span></a><a href="projects.html" data-page="projects">▦ <span>المشاريع</span></a><a href="entities.html" data-page="entities">🏛 <span>الجهات الحكومية</span></a><a href="indicators.html" data-page="indicators">◈ <span>المؤشرات</span></a><a href="companies.html" data-page="companies">▣ <span>الشركات</span></a><a href="local-content.html" data-page="local-content">◫ <span>المحتوى المحلي</span></a><a href="report-form.html" data-page="report-form">＋ <span>إدخال تقرير</span></a><a href="settings.html" data-page="settings">⚙ <span>الإعدادات</span></a></nav></aside><main class="main"><div id="loading" class="card">جارٍ تحميل بيانات المشروع...</div><div id="root" hidden></div></main></div><script src="data.js"></script><script src="app.js"></script><script>PTLC.ready.then(async()=>{const id=new URLSearchParams(location.search).get("id");if(!id){location.replace("projects.html");return}try{const q="?project_id=eq."+encodeURIComponent(id),r=(await PTLC.api("/project_dashboard"+q+"&select=*"))[0],plans=await PTLC.api("/local_content_plans"+q+"&select=*&order=created_at.desc&limit=1"),reports=await PTLC.api("/quarterly_reports"+q+"&select=*&order=year_no.asc,quarter_no.asc");if(!r)throw Error("المشروع غير موجود.");const p=plans[0],esc=PTLC.esc,card=(a,b)=>'<div class="data-row"><span>'+a+'</span><b>'+b+'</b></div>';document.getElementById("root").innerHTML='<div class="hero"><h1>'+esc(r.project_name)+'</h1><div class="meta"><span>الجهة: <strong>'+esc(r.government_entity)+'</strong></span><span>المناقصة: <strong>'+esc(r.tender_no||"—")+'</strong></span></div><div class="actions" style="margin-top:15px"><a class="btn" href="projects.html">العودة للمشاريع</a><a class="btn primary" href="report-form.html?id='+encodeURIComponent(id)+'">+ إدخال تقرير</a></div></div><div class="info-grid"><div class="info-item"><small>قيمة المشروع</small><b>'+PTLC.money(r.project_value)+'</b></div><div class="info-item"><small>الإنجاز</small><b>'+PTLC.n(r.completion_percent).toFixed(1)+'%</b></div><div class="info-item"><small>الحالة</small><b>'+esc(r.project_status||"—")+'</b></div><div class="info-item"><small>الشركة</small><b>'+esc(r.company_name||"—")+'</b></div><div class="info-item"><small>التعمين</small><b>'+PTLC.pct(r.omanization_percent)+'</b></div><div class="info-item"><small>SME</small><b>'+PTLC.pct(r.sme_percent)+'</b></div></div><div class="section"><div class="kpis"><div class="kpi"><div class="label">إجمالي الصرف</div><div class="value">'+PTLC.money(r.total_expenditure)+'</div></div><div class="kpi"><div class="label">إجمالي المحتوى المحلي</div><div class="value">'+PTLC.money(r.total_local_content)+'</div></div><div class="kpi"><div class="label">المحتوى المحلي / الصرف</div><div class="value">'+PTLC.pct(r.local_content_expenditure_percent)+'</div></div><div class="kpi"><div class="label">المحتوى المحلي / قيمة المشروع</div><div class="value">'+PTLC.pct(r.local_content_project_value_percent)+'</div></div></div></div><div class="grid2 section"><div id="workforce" class="card"><h2>العمالة والرواتب</h2>'+card("العمانيون",PTLC.num(r.omani_count))+card("غير العمانيين",PTLC.num(r.foreign_count))+card("نسبة التعمين",PTLC.pct(r.omanization_percent))+card("رواتب العمانيين",PTLC.money(r.cumulative_omani_salary))+card("رواتب الأجانب",PTLC.money(r.cumulative_foreign_salary))+'</div><div id="purchases" class="card"><h2>المشتريات</h2>'+card("صنع في عمان",PTLC.money(r.cumulative_made_in_oman))+card("مورد محلي",PTLC.money(r.cumulative_local_supplier))+card("استيراد مباشر",PTLC.money(r.cumulative_direct_import))+card("مورد SME",PTLC.money(r.cumulative_sme_purchase))+'</div></div><div class="grid2 section"><div id="services" class="card"><h2>الخدمات</h2>'+card("مزود محلي",PTLC.money(r.cumulative_local_service))+card("مزود أجنبي",PTLC.money(r.cumulative_foreign_service))+card("مزود SME",PTLC.money(r.cumulative_sme_service))+'</div><div id="subcontracts" class="card"><h2>عقود الباطن</h2>'+card("الإجمالي",PTLC.money(r.cumulative_subcontracts))+card("نسبة SME",PTLC.pct(r.sme_percent))+'</div></div><div id="plan" class="section card"><div class="section-head"><h2>الخطة</h2><a class="btn primary" href="plan.html?id='+encodeURIComponent(id)+'&mode='+(p?"edit":"add")+'">'+(p?"تحديث الخطة":"إضافة الخطة")+'</a></div><div class="alert info">'+(p?"الخطة مسجلة — "+esc(p.status||"مسودة"):"لا توجد خطة مسجلة لهذا المشروع.")+'</div></div><div id="reports" class="section card"><div class="section-head"><h2>التقارير الربع سنوية</h2><a class="btn primary" href="report-form.html?id='+encodeURIComponent(id)+'">+ إدخال تقرير</a></div><div class="table-wrap"><table class="table"><thead><tr><th>الربع</th><th>السنة</th><th>النوع</th><th>الحالة</th><th></th></tr></thead><tbody>'+[1,2,3,4].map(q=>{const z=reports.find(x=>x.quarter_no===q);return '<tr><td>Q'+q+'</td><td>'+esc(z?z.year_no:"—")+'</td><td>'+esc(z?z.report_type:"—")+'</td><td>'+esc(z?z.status:"غير مسجل")+'</td><td><a class="project-link" href="report-form.html?id='+encodeURIComponent(id)+'&q='+q+'">'+(z?"عرض/تعديل":"إدخال")+'</a></td></tr>'}).join("")+'</tbody></table></div></div>';document.getElementById("loading").hidden=true;document.getElementById("root").hidden=false}catch(e){document.getElementById("loading").innerHTML='<div class="alert warn">'+PTLC.esc(e.message)+'</div><a class="btn primary" href="projects.html">العودة للمشاريع</a>'}})</script></body></html>
