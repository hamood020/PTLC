<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة المشروع</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="projects">
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">م</div><div><b>منصة متابعة المشاريع</b><small>المحتوى المحلي والمناقصات</small></div></div>
<nav class="nav">
<a href="index.html">⌂ <span>الرئيسية</span></a><a href="projects-live.html" class="active">▦ <span>المشاريع</span></a>
<a href="entities.html">🏛 <span>الجهات الحكومية</span></a><a href="indicators.html">◈ <span>المؤشرات</span></a>
<a href="companies.html">▣ <span>الشركات</span></a><a href="local-content.html">◫ <span>المحتوى المحلي</span></a>
<a href="report-form.html">＋ <span>إدخال تقرير</span></a><a href="settings.html">⚙ <span>الإعدادات</span></a>
</nav></aside>
<main class="main">
<div id="loading" class="card">جارٍ تحميل بيانات المشروع...</div>
<div id="root" hidden></div>
</main></div>
<script src="data.js"></script>
<script>
(function(){
"use strict";
const C=window.PTLC_CONFIG||{},API=C.url+"/rest/v1",KEY=C.key,ACCESS="icv_access_token";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
const money=v=>n(v).toLocaleString("en-US",{maximumFractionDigits:0})+" ر.ع";
const pct=v=>(n(v)*100).toFixed(1)+"%";
async function get(path){
 const token=localStorage.getItem(ACCESS);
 if(!token) throw Error("لا توجد جلسة دخول.");
 const res=await fetch(API+path,{headers:{apikey:KEY,Authorization:"Bearer "+token}});
 const raw=await res.text();let d;try{d=raw?JSON.parse(raw):[];}catch{d=raw}
 if(!res.ok)throw Error((d&&d.message)||(d&&d.hint)||("HTTP "+res.status));
 return d;
}
function row(a,b){return '<div class="data-row"><span>'+a+'</span><b>'+b+'</b></div>'}
async function load(){
 const id=new URLSearchParams(location.search).get("id");
 if(!id){location.replace("projects-live.html");return}
 const q="?id=eq."+encodeURIComponent(id);
 const p=(await get("/projects"+q+"&select=*"))[0];
 if(!p)throw Error("المشروع غير موجود.");
 const entity=(await get("/government_entities?id=eq."+encodeURIComponent(p.government_entity_id)+"&select=id,name"))[0];
 const company=p.company_id?(await get("/companies?id=eq."+encodeURIComponent(p.executing_company_id)+"&select=id,name"))[0]:null;
 const [reports,plans,results]=await Promise.all([
   get("/quarterly_reports?project_id=eq."+encodeURIComponent(id)+"&select=id,year_no,quarter_no,report_date,received_date,report_type,status,notes&order=year_no.asc,quarter_no.asc"),
   get("/local_content_plans?project_id=eq."+encodeURIComponent(id)+"&select=id,plan_date,version,duration_months,status,notes&order=created_at.desc&limit=1"),
   get("/project_results?project_id=eq."+encodeURIComponent(id)+"&select=*&order=updated_at.desc&limit=1")
 ]);
 const r=results[0]||{};
 const plan=plans[0];
 const root=$("root");
 root.innerHTML=
 '<div class="hero"><h1>'+esc(p.project_name)+'</h1><div class="meta"><span>الجهة: <strong>'+esc(entity?.name||"—")+'</strong></span><span>المناقصة: <strong>'+esc(p.tender_no||"—")+'</strong></span></div><div class="actions" style="margin-top:15px"><a class="btn" href="projects-live.html">العودة للمشاريع</a><a class="btn primary" href="report-form.html?id='+encodeURIComponent(id)+'">+ إدخال تقرير</a></div></div>'+
 '<div class="info-grid"><div class="info-item"><small>قيمة المشروع</small><b>'+money(p.project_value)+'</b></div><div class="info-item"><small>تاريخ البدء</small><b>'+esc(p.start_date||"—")+'</b></div><div class="info-item"><small>تاريخ الانتهاء</small><b>'+esc(p.end_date||"—")+'</b></div><div class="info-item"><small>الإنجاز</small><b>'+n(p.completion_percent*100).toFixed(1)+'%</b></div><div class="info-item"><small>الحالة</small><b>'+esc(p.project_status||"—")+'</b></div><div class="info-item"><small>الشركة المنفذة</small><b>'+esc(company?.name||"—")+'</b></div></div>'+
 '<div class="section"><div class="kpis"><div class="kpi"><div class="label">إجمالي الصرف</div><div class="value">'+money(r.total_expenditure)+'</div></div><div class="kpi"><div class="label">إجمالي المحتوى المحلي</div><div class="value">'+money(r.total_local_content)+'</div></div><div class="kpi"><div class="label">المحتوى المحلي / الصرف</div><div class="value">'+pct(r.local_content_expenditure_percent)+'</div></div><div class="kpi"><div class="label">المحتوى المحلي / قيمة المشروع</div><div class="value">'+pct(r.local_content_project_value_percent)+'</div></div></div></div>'+
 '<div class="grid2 section"><div class="card"><h2>العمالة والرواتب</h2>'+row("العمانيون",n(r.cumulative_omani_count))+row("غير العمانيين",n(r.cumulative_foreign_count))+row("نسبة التعمين",pct(r.omanization_percent))+row("رواتب العمانيين",money(r.omani_salary_actual))+row("رواتب الأجانب",money(r.foreign_salary_actual))+'</div><div class="card"><h2>نتائج المحتوى المحلي</h2>'+row("المشتريات",money(r.purchases_actual))+row("الخدمات",money(r.services_actual))+row("عقود الباطن",money(r.subcontracts_actual))+row("SME",pct(r.sme_percent))+'</div></div>'+
 '<div class="grid2 section"><div class="card"><div class="section-head"><h2>الخطة</h2><a class="btn primary" href="plan.html?id='+encodeURIComponent(id)+'&mode='+(plan?"edit":"add")+'">'+(plan?"تعديل الخطة":"إضافة الخطة")+'</a></div>'+(plan?row("تاريخ الخطة",plan.plan_date||"—")+row("الإصدار",plan.version||"—")+row("المدة",n(plan.duration_months)+" شهر")+row("الحالة",plan.status||"—"):'<div class="alert info">لا توجد خطة مسجلة لهذا المشروع.</div>')+'</div><div class="card"><h2>ملخص التقارير</h2>'+row("التقارير المسجلة",reports.length)+row("آخر تقرير",reports.length?"Q"+reports[reports.length-1].quarter_no+" / "+reports[reports.length-1].year_no:"—")+row("حالة آخر تقرير",reports.length?(reports[reports.length-1].status||"—"):"غير مسجل")+'</div></div>'+
 '<div id="reports" class="section card"><div class="section-head"><h2>التقارير الربع سنوية</h2><a class="btn primary" href="report-form.html?id='+encodeURIComponent(id)+'">+ إدخال تقرير</a></div><div class="table-wrap"><table class="table"><thead><tr><th>الربع</th><th>السنة</th><th>التاريخ</th><th>النوع</th><th>الحالة</th><th>ملاحظات</th><th></th></tr></thead><tbody>'+[1,2,3,4].map(qn=>{const z=reports.find(x=>x.quarter_no===qn);return '<tr><td>Q'+qn+'</td><td>'+esc(z?.year_no||"—")+'</td><td>'+esc(z?.report_date||"—")+'</td><td>'+esc(z?.report_type||"—")+'</td><td>'+esc(z?.status||"غير مسجل")+'</td><td>'+esc(z?.notes||"")+'</td><td><a class="project-link" href="report-form.html?id='+encodeURIComponent(id)+'&q='+qn+'">'+(z?"عرض/تعديل":"إدخال")+'</a></td></tr>'}).join("")+'</tbody></table></div></div>';
 $("loading").hidden=true;root.hidden=false;
}
load().catch(e=>{$("loading").innerHTML='<div class="alert warn"><b>تعذر تحميل المشروع</b><br>'+esc(e.message)+'</div><div style="margin-top:12px"><a class="btn primary" href="projects-live.html">العودة للمشاريع</a></div>'});
})();
</script></body></html>
