<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشركات</title><link rel="stylesheet" href="styles.css"></head><body data-page="companies"><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">م</div><div><b>منصة متابعة المشاريع</b><small>المحتوى المحلي والمناقصات</small></div></div><nav class="nav"><a href="index.html" data-page="dashboard">⌂ <span>الرئيسية</span></a><a href="projects.html" data-page="projects">▦ <span>المشاريع</span></a><a href="entities.html" data-page="entities">🏛 <span>الجهات الحكومية</span></a><a href="indicators.html" data-page="indicators">◈ <span>المؤشرات</span></a><a href="companies.html" data-page="companies">▣ <span>الشركات</span></a><a href="local-content.html" data-page="local-content">◫ <span>المحتوى المحلي</span></a><a href="report-form.html" data-page="report-form">＋ <span>إدخال تقرير</span></a><a href="settings.html" data-page="settings">⚙ <span>الإعدادات</span></a></nav></aside><main class="main"><div class="topbar"><div class="title"><h1>الشركات</h1><p>البحث عن الشركة وعرض المشاريع المرتبطة بها ومؤشرات المحتوى المحلي</p></div></div><div class="card"><div class="field" style="max-width:560px"><label>بحث باسم الشركة</label><input id="q" placeholder="اكتب اسم الشركة المنفذة"></div></div><div class="section-head"><h2>الشركات والمشاريع</h2><span id="count"></span></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>الشركة</th><th>المشروع</th><th>الجهة</th><th>التعمين</th><th>المحتوى المحلي</th><th>SME</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="data.js"></script><script src="app.js"></script><script>PTLC.ready.then(async()=>{const all=await PTLC.api("/project_dashboard?select=*");function draw(){const q=document.getElementById("q").value.trim().toLowerCase(),x=all.filter(p=>!q||String(p.company_name||"").toLowerCase().includes(q));document.getElementById("count").textContent=x.length+" سجل";document.getElementById("rows").innerHTML=x.map(p=>'<tr><td><b>'+PTLC.esc(p.company_name||"—")+'</b></td><td><a class="project-link" href="project.html?id='+encodeURIComponent(p.project_id)+'">'+PTLC.esc(p.project_name)+'</a></td><td>'+PTLC.esc(p.government_entity)+'</td><td>'+PTLC.pct(p.omanization_percent)+'</td><td>'+PTLC.money(p.total_local_content)+'</td><td>'+PTLC.pct(p.sme_percent)+'</td></tr>').join("")||'<tr><td colspan="6">لا توجد نتائج</td></tr>'}document.getElementById("q").addEventListener("input",draw);draw()}).catch(()=>{})</script></body></html>
