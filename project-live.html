<title>تفاصيل المشروع</title><link rel="stylesheet" href="styles.css"><style>
.detail-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.detail-head h1{margin:0 0 8px;font-size:24px;line-height:1.5}.detail-head .meta{color:var(--muted);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.status-large{padding:7px 12px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}.project-progress{margin-top:14px}.project-progress .line{height:10px;background:#e8edf2;border-radius:99px;overflow:hidden}.project-progress .line i{display:block;height:100%;background:var(--primary);border-radius:99px}.project-progress .labels{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--muted)}.contractor-box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.data-cell{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.data-cell small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.data-cell b{font-size:12px}.remaining.ok-rem{color:var(--green)}.remaining.late-rem{color:var(--red)}.compare-table{width:100%;border-collapse:collapse}.compare-table th,.compare-table td{padding:12px;border-bottom:1px solid var(--line);font-size:11px;text-align:right}.compare-table th{background:#f8fafc;color:#667085;font-size:10px}.compare-table tr:last-child td{border-bottom:0}.compare-table .actual{font-weight:800}.delta{font-weight:800}.state-ok{color:var(--green);font-weight:800}.state-bad{color:var(--red);font-weight:800}.state-neutral{color:#64748b;font-weight:700}.plan-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.plan-box{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.plan-box small{display:block;color:var(--muted);font-size:10px}.plan-box b{display:block;margin-top:4px;font-size:13px}.empty-plan{padding:18px;border:1px dashed #cbd5e1;border-radius:12px;background:#fbfcfd;color:var(--muted);font-size:11px}.report-actions{display:flex;gap:6px;flex-wrap:wrap}.report-status{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px}.report-status.approved,.report-status.received{background:#eaf8ee;color:#15803d}.report-status.draft{background:#fff7e8;color:#b45309}.report-status.rejected,.report-status.cancelled{background:#feecec;color:#b91c1c}.report-status.other{background:#f1f5f9;color:#64748b}.note{padding:11px 13px;border-radius:11px;background:#f8fafc;color:#667085;font-size:10px}
@media(max-width:1100px){.contractor-box,.plan-summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.detail-head{display:block}.detail-actions{margin-top:12px}.contractor-box,.plan-summary{grid-template-columns:1fr}.compare-table{min-width:760px}}
