<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة متابعة المشاريع</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Arial,Tahoma,sans-serif}.card{width:min(430px,90vw);background:#fff;padding:32px;border-radius:20px;box-shadow:0 12px 35px #0002}.logo{width:60px;height:60px;border-radius:16px;background:#0f766e;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:22px;margin-bottom:18px}h1{margin:0 0 8px}.muted{color:#6b7280;margin-bottom:24px}.field{margin:15px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8dee8;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#0f766e;color:white;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#msg{margin-top:14px;text-align:center;color:#b42318;min-height:20px}</style></head><body><main class="card"><div class="logo">ICV</div><h1>منصة متابعة المشاريع</h1><div class="muted">تسجيل الدخول باسم المستخدم وكلمة المرور</div><form id="f"><div class="field"><label>اسم المستخدم</label><input id="u" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password" required></div><button id="b" type="submit">دخول</button></form><div id="msg"></div></main><script>const endpoint='https://vnagbtgxxwgfdbpczlin.supabase.co/functions/v1/auth-login';document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('msg'),u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;b.disabled=true;b.textContent='جارٍ تسجيل الدخول...';m.textContent='';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:u+'@icv-platform.local',password:p})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw new Error(d.error_description||d.message||('فشل تسجيل الدخول - HTTP '+r.status));localStorage.setItem('icv_access_token',d.access_token);localStorage.setItem('icv_refresh_token',d.refresh_token||'');window.location.replace('platform.html?session=1');}catch(x){m.textContent=x.message||String(x);b.disabled=false;b.textContent='دخول';}});</script></body></html>
