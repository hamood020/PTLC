name: Sync platform frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current platform
        run: |
          curl -fsSL "https://vnagbtgxxwgfdbpczlin.supabase.co/functions/v1/icv-platform" -o index.html
          test -s index.html
          grep -q "<!doctype html" index.html

      - name: Publish full frontend
        run: |
          mkdir -p icv-followup
          cp index.html icv-followup/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html icv-followup/index.html
          if git diff --cached --quiet; then
            echo "No frontend changes."
            exit 0
          fi
          git commit -m "Manual-only legacy frontend sync"
          git push
