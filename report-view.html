<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعراض التقرير</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="report-form">
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">م</div><div><b>منصة متابعة المشاريع</b><small>المحتوى المحلي والمناقصات</small></div></div>
<nav class="nav"><a href="index.html">⌂ <span>الرئيسية</span></a><a href="projects-live.html">▦ <span>المشاريع</span></a><a href="entities.html">🏛 <span>الجهات الحكومية</span></a><a href="indicators.html">◈ <span>المؤشرات</span></a><a href="companies.html">▣ <span>الشركات</span></a><a href="local-content.html">◫ <span>المحتوى المحلي</span></a><a href="report-form.html" class="active">＋ <span>إدخال تقرير</span></a><a href="settings.html">⚙ <span>الإعدادات</span></a></nav></aside>
<main class="main"><div id="loading" class="card">جارٍ تحميل التقرير...</div><div id="root" hidden></div></main></div>
<script src="data.js"></script><script src="app.js"></script>
<script>
(function(){const $=id=>document.getElementById(id),esc=PTLC.esc,n=PTLC.n,money=PTLC.money,pct=v=>Number.isFinite(Number(v))?(Number(v)*100).toFixed(1)+"%":"—",date=s=>s?new Date(s+"T00:00:00").toLocaleDateString("ar-OM"): "—",id=new URLSearchParams(location.search).get("id");const row=(a,b)=>'<div class="data-row"><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>';
async function load(){if(!id)throw Error("لم يتم تحديد التقرير.");const r=(await PTLC.api("/quarterly_reports?id=eq."+encodeURIComponent(id)+"&select=*"))[0];if(!r)throw Error("التقرير غير موجود.");const p=(await PTLC.api("/projects?id=eq."+encodeURIComponent(r.project_id)+"&select=id,project_name,project_value"))[0];const [w,s,pur,sv,sub,sme]=await Promise.all([PTLC.api("/report_workforce?report_id=eq."+id+"&select=*"),PTLC.api("/report_salaries?report_id=eq."+id+"&select=*"),PTLC.api("/report_purchases?report_id=eq."+id+"&select=*"),PTLC.api("/report_services?report_id=eq."+id+"&select=*"),PTLC.api("/report_subcontracts?report_id=eq."+id+"&select=*"),PTLC.api("/report_sme?report_id=eq."+id+"&select=*")]);const wo=w.reduce((s,x)=>s+n(x.omani_count),0),wf=w.reduce((s,x)=>s+n(x.foreign_count),0),os=s[0]?.omani_salary||0,fs=s[0]?.foreign_salary||0;const list=(arr,type)=>arr.length?arr.map(x=>'<tr><td>'+esc(type==="p"?x.supply_type:type==="s"?x.supplier_type:type==="u"?x.supplier_type:x.sme_type)+'</td><td>'+money(x.actual_value)+'</td></tr>').join(""):'<tr><td colspan="2">لا توجد بيانات</td></tr>';const root=$("root");root.innerHTML='<div class="topbar"><div class="title"><h1>استعراض التقرير</h1><p>'+esc(p?.project_name||"—")+' — Year '+esc(r.year_no)+' / Q'+esc(r.quarter_no)+'</p></div><div class="actions"><a class="btn" href="project-live.html?id='+encodeURIComponent(r.project_id)+'">العودة للمشروع</a><a class="btn primary" href="report-form.html?id='+encodeURIComponent(r.project_id)+'&q='+encodeURIComponent(r.quarter_no||1)+'">تعديل التقرير</a></div></div><div class="grid2"><div class="card"><h2>بيانات التقرير</h2>'+row("الفترة","Year "+r.year_no+" / Q"+r.quarter_no)+row("تاريخ التقرير",date(r.report_date))+row("تاريخ الاستلام",date(r.received_date))+row("النوع",r.report_type)+row("الحالة",r.status)+row("الملاحظات",r.notes||"—")+'</div><div class="card"><h2>العمالة والرواتب</h2>'+row("العمانيون",wo)+row("الأجانب",wf)+row("نسبة التعمين",pct(wo+wf?wo/(wo+wf):0))+row("رواتب العمانيين",money(os))+row("رواتب الأجانب",money(fs))+'</div></div><div class="grid2 section"><div class="card"><h2>المشتريات</h2><div class="table-wrap"><table class="table"><thead><tr><th>النوع</th><th>القيمة</th></tr></thead><tbody>'+list(pur,"p")+'</tbody></table></div></div><div class="card"><h2>الخدمات</h2><div class="table-wrap"><table class="table"><thead><tr><th>النوع</th><th>القيمة</th></tr></thead><tbody>'+list(sv,"s")+'</tbody></table></div></div></div><div class="grid2 section"><div class="card"><h2>عقود الباطن</h2><div class="table-wrap"><table class="table"><thead><tr><th>النوع</th><th>القيمة</th></tr></thead><tbody>'+list(sub,"u")+'</tbody></table></div></div><div class="card"><h2>SME</h2><div class="table-wrap"><table class="table"><thead><tr><th>النوع</th><th>القيمة</th></tr></thead><tbody>'+list(sme,"m")+'</tbody></table></div></div></div>';$("loading").hidden=true;root.hidden=false}
PTLC.ready.then(load).catch(e=>$("loading").innerHTML='<div class="alert warn"><b>تعذر تحميل التقرير</b><br>'+esc(e.message)+'</div>')})();
</script></body></html>
