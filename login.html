<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - منصة متابعة المشاريع</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#6b7280;--line:#e8edf4;--primary:#0f766e;--primary2:#0b5f59;--shadow:0 25px 70px rgba(0,0,0,.18)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:linear-gradient(135deg,#0e2f2c,#115e59);color:var(--ink);font-family:Cairo,Arial,sans-serif}
button,input{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.logo{width:58px;height:58px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;margin-bottom:18px}
h1{margin:0 0 8px;font-size:25px}
.muted{color:var(--muted);font-size:12px}
.field{margin:18px 0 12px}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;font-family:inherit;font-size:13px;outline:none}
.field input:focus{border-color:#9bc9c4;box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.btn{width:100%;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:11px;padding:11px 14px;font-family:inherit;cursor:pointer;font-weight:700;font-size:13px;margin-top:6px}
.btn:hover{background:var(--primary2)}
.btn:disabled{opacity:.65;cursor:wait}
#msg{margin-top:13px;color:#dc2626;text-align:center;min-height:20px;font-size:11px}
.brand-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:10px}
</style>
</head>
<body>
<section class="login">
<div class="login-card">
<div class="logo">ICV</div>
<h1>منصة متابعة المشاريع</h1>
<div class="muted">تسجيل الدخول باسم المستخدم وكلمة المرور</div>

<form id="loginForm">
<div class="field">
<label for="u">اسم المستخدم</label>
<input id="u" autocomplete="username" required autofocus>
</div>
<div class="field">
<label for="p">كلمة المرور</label>
<input id="p" type="password" autocomplete="current-password" required>
</div>
<button id="btn" class="btn" type="submit">دخول</button>
</form>

<div id="msg"></div>
<div class="brand-note">منصة متابعة المشاريع والمحتوى المحلي</div>
</div>
</section>

<script>
const endpoint='https://vnagbtgxxwgfdbpczlin.supabase.co/functions/v1/auth-login';

document.getElementById('loginForm').addEventListener('submit',async function(e){
 e.preventDefault();
 const btn=document.getElementById('btn'),msg=document.getElementById('msg');
 const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
 if(!u||!p){msg.textContent='أدخل اسم المستخدم وكلمة المرور.';return}
 btn.disabled=true;
 btn.textContent='جارٍ الاتصال...';
 msg.textContent='';
 try{
  const r=await fetch(endpoint,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({email:u+'@icv-platform.local',password:p})
  });
  const t=await r.text();
  let d={};
  try{d=JSON.parse(t)}catch(_){}
  if(!r.ok||!d.access_token){
   msg.textContent=d.error_description||d.message||('فشل تسجيل الدخول - HTTP '+r.status);
   return;
  }
  localStorage.setItem('icv_access_token',d.access_token);
  localStorage.setItem('icv_refresh_token',d.refresh_token||'');
  location.href='index.html?session=1&v=20261002-login';
 }catch(err){
  msg.textContent='تعذر الاتصال: '+(err.message||err);
 }finally{
  btn.disabled=false;
  btn.textContent='دخول';
 }
});
</script>
</body>
</html>
