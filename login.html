<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - منصة متابعة المشاريع</title><style>body{margin:0;background:#f5f7fb;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,90vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 12px 35px #0001}.logo{width:58px;height:58px;border-radius:15px;background:#0e2f2c;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:20px;margin-bottom:18px}h1{margin:0 0 8px;color:#162033}.muted{color:#6b7280;margin-bottom:25px}.field{margin:16px 0}label{display:block;margin-bottom:7px;font-weight:bold;color:#162033}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe5ec;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:10px;padding:13px;background:#0f766e;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#msg{margin-top:15px;color:#dc2626;text-align:center;min-height:20px}</style></head><body><main class="card"><div class="logo">ICV</div><h1>منصة متابعة المشاريع</h1><div class="muted">تسجيل الدخول باسم المستخدم وكلمة المرور</div><form id="loginForm"><div class="field"><label for="u">اسم المستخدم</label><input id="u" autocomplete="username" required></div><div class="field"><label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" required></div><button id="btn" type="submit">دخول</button></form><div id="msg"></div></main><script>
const endpoint='https://vnagbtgxxwgfdbpczlin.supabase.co/functions/v1/auth-login';
document.getElementById('loginForm').addEventListener('submit',async function(e){
 e.preventDefault();
 const btn=document.getElementById('btn'),msg=document.getElementById('msg');
 const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
 if(!u||!p){msg.textContent='أدخل اسم المستخدم وكلمة المرور.';return}
 btn.disabled=true;btn.textContent='جارٍ الاتصال...';msg.textContent='';
 try{
  const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:u+'@icv-platform.local',password:p})});
  const t=await r.text();let d={};try{d=JSON.parse(t)}catch(_){}
  if(!r.ok||!d.access_token){msg.textContent=(d.error_description||d.message||('فشل تسجيل الدخول - HTTP '+r.status));return}
  localStorage.setItem('icv_access_token',d.access_token);
  localStorage.setItem('icv_refresh_token',d.refresh_token||'');
  location.href='app-final.html?session=1&v=20261001-21';
 }catch(err){msg.textContent='تعذر الاتصال: '+(err.message||err)}
 finally{btn.disabled=false;btn.textContent='دخول'}
});
</script></body></html>
